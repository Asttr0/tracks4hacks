<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#08080f"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.55"/>

  <!-- Radar rings -->
  <circle cx="32" cy="38" r="16" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.25"/>
  <circle cx="32" cy="38" r="9"  fill="none" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- Crosshair -->
  <line x1="32" y1="18" x2="32" y2="28" stroke="#ef4444" stroke-width="1.3" stroke-opacity="0.7" filter="url(#glow)"/>
  <line x1="32" y1="48" x2="32" y2="58" stroke="#ef4444" stroke-width="1.3" stroke-opacity="0.7"/>
  <line x1="12"  y1="38" x2="22" y2="38" stroke="#ef4444" stroke-width="1.3" stroke-opacity="0.7"/>
  <line x1="42" y1="38" x2="52" y2="38" stroke="#ef4444" stroke-width="1.3" stroke-opacity="0.7"/>

  <!-- Center dot -->
  <circle cx="32" cy="38" r="3" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="32" cy="38" r="1.2" fill="#ffffff"/>

  <!-- T4H label using system serif — loads reliably in browser tab -->
  <text
    x="32" y="18"
    text-anchor="middle"
    fill="#ffffff"
    font-size="10"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    letter-spacing="1.5"
    opacity="0.92"
  >T4H</text>
</svg>
